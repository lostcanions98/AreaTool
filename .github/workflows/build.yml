name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build Everything
        run: |
          # 1. Install necessary dependencies
          sudo gem install cocoapods
          npm install
          
          # 2. Sync (this generates the iOS platform)
          npx cap sync ios
          
          # 3. Find the workspace dynamically
          WORKSPACE=$(find . -name "App.xcworkspace" -print -quit)
          if [ -z "$WORKSPACE" ]; then
             echo "CRITICAL: Could not find App.xcworkspace."
             echo "Listing all files in the repository to locate it:"
             find . -maxdepth 3
             exit 1
          fi
          
          # 4. Navigate to the actual folder found
          PROJECT_DIR=$(dirname "$WORKSPACE")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 5. Build
          pod install
          xcodebuild -workspace "App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          # 6. Package
          mkdir -p Payload
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: /**/AreaTool.ipa
