name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install and Sync
        run: |
          npm install
          npx cap add ios || true
          npx cap sync ios
          
      - name: Build and Package
        run: |
          cd ios/App
          # Explicit build command
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos build
          
          # Explicit packaging (using the path from your screenshot)
          mkdir -p Payload
          if [ -d "build/Release-iphoneos/App.app" ]; then
            cp -r build/Release-iphoneos/App.app Payload/
          else
            echo "ERROR: Could not find App.app at build/Release-iphoneos/App.app"
            ls -R build
            exit 1
          fi
          
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: ios/App/AreaTool.ipa
