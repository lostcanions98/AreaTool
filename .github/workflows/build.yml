name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build App
        run: |
          # 1. Install dependencies
          npm install
          
          # 2. Sync to ensure iOS project is updated
          npx cap sync ios
          
          # 3. Find the directory containing the Podfile/Workspace dynamically
          # This removes the need for 'cd ios/App'
          WORKSPACE=$(find . -name "App.xcworkspace" -print -quit)
          PROJECT_DIR=$(dirname "$WORKSPACE")
          
          echo "Found project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 4. Install Pods and Build
          pod install
          xcodebuild -workspace "App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          # 5. Package the IPA dynamically
          mkdir -p Payload
          # Locate the .app file inside the build folder
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: /**/AreaTool.ipa
