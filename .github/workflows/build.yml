name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup and Sync
        run: |
          # 1. Prepare Environment
          sudo gem install cocoapods
          npm install
          
          # 2. Fresh iOS Build
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
      - name: Install Pods and Build
        run: |
          # 3. Enter the correct directory
          cd ios/App
          pod install
          
          # 4. Build using the CORRECT workspace name we found
          xcodebuild -workspace "Capacitor.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
      - name: Package IPA
        run: |
          # 5. Package the app into an IPA
          mkdir -p Payload
          
          # Find the generated .app file dynamically so we don't miss it
          APP_PATH=$(find ios/App/build -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: AreaTool.ipa
