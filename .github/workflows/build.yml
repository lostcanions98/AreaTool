name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build and Package
        run: |
          # 1. Setup environment
          sudo gem install cocoapods
          npm install
          
          # 2. Sync ensures the iOS project is generated
          npx cap sync ios
          
          # 3. LOCATE WORKSPACE DYNAMICALLY
          # This line finds the EXACT path of the workspace
          WORKSPACE=$(find . -name "App.xcworkspace" -type d -print -quit)
          
          # If it doesn't find it, the script fails and shows you the file map
          if [ -z "$WORKSPACE" ]; then
             echo "CRITICAL ERROR: App.xcworkspace not found!"
             echo "--- DUMPING DIRECTORY STRUCTURE ---"
             find . -maxdepth 3 -not -path '*/.*'
             exit 1
          fi
          
          # 4. Navigate and Build
          PROJECT_DIR=$(dirname "$WORKSPACE")
          echo "Found project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          pod install
          xcodebuild -workspace "App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          # 5. Package
          mkdir -p Payload
          # Search for the .app file
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: "**/AreaTool.ipa"
