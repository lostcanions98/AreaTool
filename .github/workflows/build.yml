name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build and Package
        run: |
          # 1. Setup environment
          sudo gem install cocoapods
          npm install
          
          # 2. Force fresh platform creation
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          # 3. DYNAMIC LOCATOR: Find where the workspace was actually created
          WORKSPACE_PATH=$(find . -name "App.xcworkspace" -print -quit)
          
          if [ -z "$WORKSPACE_PATH" ]; then
             echo "CRITICAL ERROR: Could not find App.xcworkspace."
             echo "--- DUMPING DIRECTORY STRUCTURE TO DEBUG ---"
             find . -maxdepth 3 -not -path '*/.*'
             exit 1
          fi
          
          # 4. Extract project directory and build
          PROJECT_DIR=$(dirname "$WORKSPACE_PATH")
          echo "Found workspace at: $WORKSPACE_PATH"
          echo "Building in: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          pod install
          xcodebuild -workspace "App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          # 5. Package
          mkdir -p Payload
          # Search for the .app file dynamically
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: "**/AreaTool.ipa"
