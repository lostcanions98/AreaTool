name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: |
          # 1. Install CocoaPods (This fixes the 'pod: command not found' error)
          sudo gem install cocoapods
          
          # 2. Install Project Dependencies
          npm install
          
      - name: Prepare iOS Project
        run: |
          # 3. Clean and Sync
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
      - name: Build App
        run: |
          # 4. Find the workspace and build
          WORKSPACE=$(find . -name "App.xcworkspace" -print -quit)
          PROJECT_DIR=$(dirname "$WORKSPACE")
          cd "$PROJECT_DIR"
          
          xcodebuild -workspace "App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          # 5. Package
          mkdir -p Payload
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: /**/AreaTool.ipa
