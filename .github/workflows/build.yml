name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Fresh Setup
        run: |
          # 1. Clean install
          npm install
          
          # 2. Force delete any existing (and potentially broken) iOS folder
          rm -rf ios
          
          # 3. Create fresh iOS platform
          npx cap add ios
          
          # 4. Sync creates the Podfile and installs Pods correctly
          npx cap sync ios
          
      - name: Build and Package
        run: |
          # Navigate to the generated directory
          cd ios/App
          
          # Build using the workspace generated by 'cap sync'
          xcodebuild -workspace "App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          # Package
          mkdir -p Payload
          # Copy the .app file
          cp -r build/Release-iphoneos/App.app Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: ios/App/AreaTool.ipa
