name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build and Package
        run: |
          # 1. Prepare environment
          sudo gem install cocoapods
          npm install
          npx cap sync ios
          
          # 2. Find the Podfile and install pods
          # This works no matter where the folder is
          PODFILE_DIR=$(dirname "$(find . -name "Podfile" -print -quit)")
          echo "Installing pods in: $PODFILE_DIR"
          cd "$PODFILE_DIR" && pod install
          
          # 3. Find the workspace path from the root
          cd ${{ github.workspace }}
          WORKSPACE_PATH=$(find . -name "App.xcworkspace" -print -quit)
          
          if [ -z "$WORKSPACE_PATH" ]; then
             echo "ERROR: Could not find App.xcworkspace."
             find . -maxdepth 4
             exit 1
          fi
          
          echo "Building workspace at: $WORKSPACE_PATH"
          
          # 4. Build using the full path
          xcodebuild -workspace "$WORKSPACE_PATH" -scheme App -configuration Release -sdk iphoneos build
          
          # 5. Package the IPA
          mkdir -p Payload
          # Search for the .app file
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: /**/AreaTool.ipa
