name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: |
          npm install
          npx cap add ios
          cd ios/App
          # This is the missing step that creates the .xcworkspace file
          pod install
          cd ../..
          npx cap sync ios
          
      - name: Build and Package
        run: |
          echo "--- DEBUG: Workspace Check ---"
          find . -name "*.xcworkspace"
          
          # Find the workspace
          WORKSPACE_PATH=$(find . -name "App.xcworkspace" | head -n 1)
          PROJECT_DIR=$(dirname "$WORKSPACE_PATH")
          
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # Build
          xcodebuild -workspace "App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          # Package
          mkdir -p Payload
          # Move to the build folder and look for the .app
          cd build/Release-iphoneos
          cp -r *.app ../../../Payload/
          cd ../../../
          
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: ios/App/AreaTool.ipa
