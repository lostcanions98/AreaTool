name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install and Sync
        run: |
          npm install
          npx cap add ios
          npx cap sync ios
          
      - name: Locate and Build
        run: |
          echo "--- DEBUG: Checking for App.xcworkspace ---"
          find . -name "*.xcworkspace"
          
          # Find the directory containing the workspace
          WORKSPACE_PATH=$(find . -name "App.xcworkspace" -maxdepth 3 | head -n 1)
          
          if [ -z "$WORKSPACE_PATH" ]; then
            echo "ERROR: Could not find App.xcworkspace anywhere!"
            echo "Listing all files in the ios directory:"
            ls -R ios/
            exit 1
          fi
          
          # Navigate to the parent folder of the workspace and build
          PROJECT_DIR=$(dirname "$WORKSPACE_PATH")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          xcodebuild -workspace "App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          # Package the IPA
          mkdir -p Payload
          # Search for the .app file
          APP_FILE=$(find . -name "*.app" | head -n 1)
          cp -r "$APP_FILE" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: ios/App/AreaTool.ipa
