name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Debug and Initialize
        run: |
          # 1. Install necessary build tools
          sudo gem install cocoapods
          npm install
          
          # 2. Force create platform
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          # 3. AUDIT: This is the critical step.
          # If this file is missing, the script will dump the structure of your ENTIRE repo.
          if [ ! -d "ios/App" ]; then
             echo "CRITICAL: 'ios/App' directory was not created."
             echo "Listing all files in current directory to locate project:"
             find . -maxdepth 3 -not -path '*/.*'
             exit 1
          fi

      - name: Install Pods and Build
        run: |
          cd ios/App
          pod install
          
          # Check for the workspace one last time
          if [ ! -f "App.xcworkspace" ]; then
            echo "CRITICAL: App.xcworkspace not found in ios/App"
            exit 1
          fi
          
          # Build
          xcodebuild -workspace "App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          # Package
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: ios/App/AreaTool.ipa
