name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies & Sync
        run: |
          npm install
          npx cap sync ios
          
      - name: Install Pods & Build App
        run: |
          # 1. Enter the exact directory Capacitor expects
          cd ios/App
          
          # 2. Install pods here so relative paths to node_modules work properly
          pod install
          
          # 3. Build the project and force the output into a specific 'build_output' folder
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath ./build_output \
                     CODE_SIGNING_ALLOWED=NO \
                     build
                     
      - name: Package IPA
        run: |
          mkdir -p Payload
          
          # We now know exactly where the .app file is, no guessing required
          APP_PATH=$(find ios/App/build_output -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "CRITICAL ERROR: Build succeeded, but .app file was not found."
            exit 1
          fi
          
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: AreaTool.ipa
