name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies & Sync
        run: |
          npm install
          npx cap sync ios
          
      - name: Install CocoaPods
        run: |
          # Bypassing 'cd' by telling CocoaPods exactly where the project is
          pod install --project-directory=ios/App
          
      - name: Build Xcode Project
        run: |
          # Bypassing variables by hardcoding the direct absolute path
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     build
          
      - name: Package IPA
        run: |
          mkdir -p Payload
          # Finding the compiled .app safely and packaging it
          APP_PATH=$(find ios/App -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: AreaTool.ipa
