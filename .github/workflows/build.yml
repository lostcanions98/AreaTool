name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Initialize and Sync iOS Platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build Unsigned iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Package into IPA
        run: |
          # 1. Debug: List all directories to see where the build output is
          echo "Current directory:"
          pwd
          echo "Scanning for .app files:"
          find . -name "*.app" -type d
          
          # 2. Try to find the app again with a wider search
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          
          # 3. Check if we actually found something
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find any .app file!"
            exit 1
          fi
          
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: ios/App/AreaTool.ipa
