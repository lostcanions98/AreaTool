\f0\fs24 \cf0 name: Build iOS IPA\
\
on:\
  push:\
    branches: [ "main", "master" ]\
  workflow_dispatch:\
\
jobs:\
  build:\
    runs-on: macos-13 # Uses a modern macOS environment\
\
    steps:\
      - name: Checkout repository\
        uses: actions/checkout@v4\
\
      - name: Setup Node.js\
        uses: actions/setup-node@v4\
        with:\
          node-version: '20'\
\
      - name: Install Dependencies\
        run: npm install\
\
      - name: Initialize and Sync iOS Platform\
        run: |\
          npx cap add ios\
          npx cap sync ios\
\
      - name: Build Unsigned iOS App\
        run: |\
          cd ios/App\
          # Force xcodebuild to skip code signing\
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build\
\
      - name: Package into IPA\
        run: |\
          cd ios/App\
          mkdir -p Payload\
          # Move the compiled app bundle into the Payload folder\
          mv build/Release-iphoneos/App.app Payload/\
          # Zip it into an IPA format\
          zip -q -r AreaTool.ipa Payload\
\
      - name: Upload IPA Artifact\
        uses: actions/upload-artifact@v4\
        with:\
          name: AreaTool-IPA\
          path: ios/App/AreaTool.ipa}