name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Full Reset and Build
        run: |
          # 1. Clean Environment
          rm -rf ios
          npm install
          
          # 2. Re-create iOS platform
          npx cap add ios
          npx cap sync ios
          
          # 3. Explicitly enter the directory and run pod install
          # We check the directory exists first
          if [ -d "ios/App" ]; then
            cd ios/App
            pod install
            # Verify the workspace was created
            if [ ! -f "App.xcworkspace" ]; then
                echo "ERROR: pod install finished, but App.xcworkspace is missing."
                ls -la
                exit 1
            fi
          else
            echo "ERROR: 'ios/App' directory was not created by cap sync."
            ls -R ios
            exit 1
          fi
          
          # 4. Build
          cd ../..
          xcodebuild -workspace "ios/App/App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          # 5. Package
          mkdir -p Payload
          # Locate the .app file specifically
          APP_FILE=$(find ios/App/build -name "*.app" | head -n 1)
          cp -r "$APP_FILE" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: AreaTool.ipa
