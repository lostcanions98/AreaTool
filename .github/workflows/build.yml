name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: |
          npm install
          npx cap sync ios
          
      - name: Build and Archive App
        run: |
          cd ios/App
          # Force a repo update to ensure Pods are perfectly linked
          pod install --repo-update
          
          # Use 'archive' instead of 'build'. This respects all CocoaPods header paths.
          xcodebuild archive \
                     -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -archivePath ./build/AreaTool.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO
                     
      - name: Package IPA
        run: |
          # Navigate to where we built the archive
          cd ios/App
          mkdir -p Payload
          
          # The .app file is safely stored inside the archive's specific Applications folder
          cp -r build/AreaTool.xcarchive/Products/Applications/*.app Payload/
          
          # Zip it up and place it in the root repository folder
          zip -q -r ../../AreaTool.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: AreaTool.ipa
