name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install and Setup
        run: |
          # 1. Prepare Environment
          sudo gem install cocoapods
          npm install
          
          # 2. Force fresh iOS platform
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
          # 3. CRITICAL: Debugging step
          echo "--- START OF FILE LISTING ---"
          ls -R ios
          echo "--- END OF FILE LISTING ---"
          
          # 4. Check for workspace
          if [ ! -f "ios/App/App.xcworkspace" ] && [ ! -f "ios/App.xcworkspace" ]; then
             echo "Workspace NOT found. The setup step failed to generate it."
             exit 1
          fi

      - name: Build and Package
        run: |
          # Only runs if workspace was found
          WORKSPACE=$(find . -name "App.xcworkspace" | head -n 1)
          PROJECT_DIR=$(dirname "$WORKSPACE")
          cd "$PROJECT_DIR"
          
          xcodebuild -workspace "App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          mkdir -p Payload
          cp -r build/Release-iphoneos/App.app Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: /**/AreaTool.ipa
