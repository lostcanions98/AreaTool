name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build and Package
        run: |
          # 1. Setup environment
          sudo gem install cocoapods
          npm install
          
          # 2. Sync ensures the iOS project exists
          npx cap sync ios
          
          # 3. Find the workspace DYNAMICALLY
          # This line finds the file regardless of its folder location
          WORKSPACE=$(find . -name "App.xcworkspace" -print -quit)
          
          if [ -z "$WORKSPACE" ]; then
             echo "ERROR: Could not find App.xcworkspace."
             echo "Listing current directory to debug path:"
             find . -maxdepth 3
             exit 1
          fi
          
          # 4. Get the directory and build inside it
          PROJECT_DIR=$(dirname "$WORKSPACE")
          echo "Building in: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          pod install
          xcodebuild -workspace "App.xcworkspace" -scheme App -configuration Release -sdk iphoneos build
          
          # 5. Package using the same dynamic logic
          mkdir -p Payload
          APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: "**/AreaTool.ipa"
