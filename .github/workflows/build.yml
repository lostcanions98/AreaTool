name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup and Sync
        run: |
          sudo gem install cocoapods
          npm install
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          
      - name: Build App
        run: |
          cd ios/App
          pod install
          
          # Dynamically find the workspace file
          WORKSPACE=$(ls | grep .xcworkspace | head -n 1)
          echo "Found workspace: $WORKSPACE"
          
          # Build with signing disabled to ensure compilation finishes
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     build
          
      - name: Package IPA
        run: |
          mkdir -p Payload
          # Search for the compiled .app file in the build folder
          APP_PATH=$(find ios/App -name "*.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -q -r AreaTool.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AreaTool-IPA
          path: AreaTool.ipa
